<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Helix viewer demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #03060d; color: #dfe9f7; overflow: hidden; font: 13px system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #hud { position: fixed; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 5; opacity: .7; pointer-events: none; font: 11px ui-monospace, monospace; }
</style>
<script type="importmap">{"imports":{"three":"../js/vendor/three.module.min.js","three/addons/":"../js/vendor/addons/"}}</script>
</head>
<body>
<div id="stage"></div>
<div id="hud"></div>
<script type="module">
import { buildDuplex, buildCrystal, applyFrame, mulMM, rotZ, sub, add, mulMV, dist } from '../js/science/index.js';
import { createViewer } from '../js/render/viewer.js';

// URL params: rep, color, grooves, labels, crystal, waters, anim, axis, jitter, hbonds, quality, effects,
//             hl (pair ids, comma separated), focus (pair id), blob, annot, insets (top,right,bottom,left), seq
const q = new URLSearchParams(location.search);
const flag = (k, d = false) => (q.has(k) ? q.get(k) !== '0' && q.get(k) !== 'false' : d);
const asm = q.has('crystal') && flag('crystal') ? buildCrystal() : buildDuplex(q.get('seq') || 'CGCGAATTCGCGATATGGCC');
const viewer = createViewer(document.getElementById('stage'), { quality: q.get('quality') || 'auto' });
window.viewer = viewer; window.asm = asm;
viewer.setStyle({
  representation: q.get('rep') || 'ballstick',
  color: q.get('color') || 'element',
  grooves: flag('grooves'), labels: flag('labels'), waters: flag('waters'), axis: flag('axis'),
  hbonds: flag('hbonds', true), jitter: +(q.get('jitter') || 0), effects: q.get('effects') || 'auto',
  autoRotate: flag('rotate', true),
});
if (q.has('insets')) { const [top, right, bottom, left] = q.get('insets').split(',').map(Number); viewer.setViewInsets({ top, right, bottom, left }); }
viewer.setAssembly(asm);

const anim = flag('anim');
if (q.has('hl')) viewer.setHighlight({ pairs: q.get('hl').split(',').map(Number) });
if (q.has('focus')) viewer.focus({ pair: +q.get('focus') }, { duration: 0 });

const P = (nucId, name) => asm.position(asm.atomOf(nucId, name));
if (flag('annot', anim) && asm.meta.kind === 'ideal') {
  const k = 3, p = asm.pairs[k];
  const a = P(p.a, 'N1'), b = P(p.b, 'N3');
  const f = asm.nucleotides[p.a].frame;
  viewer.setAnnotations([
    { id: 'hb', kind: 'distance', from: a, to: b, label: dist(a, b).toFixed(2) + ' Å' },
    { id: 'mg', kind: 'label', at: applyFrame(asm.nucleotides[asm.pairs[Math.min(12, asm.pairs.length - 1)].a].frame, [10, 0, 0]), label: 'Major groove' },
  ]);
}
const top = Math.max(...Array.from({ length: asm.atoms.count }, (_, g) => asm.atoms.pos[g * 3 + 2]));
const blobs = flag('blob', anim) ? [{ id: 'enz', pos: [0, 0, top + 4], radius: 14, color: 0x7c5cff, label: 'Helicase', opacity: 0.35 }] : [];
viewer.setBlobs(blobs);

// anim: swing the strand-II bases of a few pairs out of the helix and back ("breathing"),
// by moving nucleotide frames (rigid bodies) and calling viewer.sync().
const opened = anim ? [4, 5, 9] : [];
const base0 = new Map();
for (const k of opened) {
  const nu = asm.nucleotides[asm.pairs[k].b];
  base0.set(k, { o: nu.frame.o.slice(), R: nu.frame.R.slice(), pivot: P(nu.id, 'P') });
}
const hud = document.getElementById('hud');
let acc = 0;
viewer.on('frame', (dt, t) => {
  if (anim) {
    opened.forEach((k, i) => {
      const s = 0.5 - 0.5 * Math.cos(t * 1.1 + i * 1.7), th = 1.5 * s;
      const f0 = base0.get(k), nu = asm.nucleotides[asm.pairs[k].b], Rz = rotZ(th);
      nu.frame.R = mulMM(Rz, f0.R);
      nu.frame.o = add(f0.pivot, mulMV(Rz, sub(f0.o, f0.pivot)));
      asm.pairs[k].strength = Math.max(0, 1 - s * 1.8);
    });
    asm.updatePositions();
    if (blobs.length) { blobs[0].pos = [Math.sin(t * 0.6) * 3, Math.cos(t * 0.6) * 3, top + 4 + Math.sin(t) * 2]; viewer.setBlobs(blobs); }
    viewer.sync();
  }
  if ((acc += dt) > 0.5) { acc = 0; const s = viewer.getState(); hud.textContent = `${s.fps} fps · ${s.quality} · ${s.atoms} atoms · ${s.representation}`; }
});
viewer.on('pick', e => { window.lastPick = e; console.log('pick', e && JSON.stringify({ nucleotide: e.nucleotide, atom: e.atom, pair: e.pair })); });
</script>
</body>
</html>
